server:
  port: 9090

spring:
  application:
    name: user-api
  datasource:
    # In-memory H2 database: nothing to install or configure.
    url: jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  servlet:
    multipart:
      # Spring's default (1MB) is too small for a few thousand generated users.
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    problemdetails:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  generator:
    max-count: 10000
  jwt:
    # Default secret so the app starts with zero configuration.
    # Override in any real deployment: APP_JWT_SECRET=<at least 32 characters>
    secret: ${APP_JWT_SECRET:c2VjcmV0LWtleS1mb3ItdGhlLXVzZXItYXBpLW1pbmktcHJvamV0LTIwMjY=}
    expiration: 1h
    issuer: user-api
